<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen del Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/resumen.css">
</head>
<body class="fondo-pantalla">
    <div class="ticket-contenedor">
        <header class="encabezado-ticket">
            <h1>¡Pedido<br class="d-block d-sm-none"> Confirmado!</h1>
        </header>
        <div class="cuerpo-ticket p-4 p-md-5">
            <div class="fila-dato">
                <strong>Cliente:</strong>
                <span id="cliente"></span>
            </div>
            <div class="fila-dato">
                <strong>Correo:</strong>
                <span id="correo"></span>
            </div>
            
            <hr class="separador">
            
            <div class="fila-dato">
                <strong>Producto:</strong>
                <span id="producto"></span>
            </div>
            <div class="fila-dato">
                <strong>Cantidad:</strong>
                <span id="cantidad"></span>
            </div>
            <div class="fila-dato">
                <strong>Tamaño:</strong>
                <span id="tamanio"></span>
            </div>
            <div class="fila-dato">
                <strong>Para llevar:</strong>
                <span id="llevar"></span>
            </div>
            
            <hr class="separador">
            
            <div class="fila-dato observacion-caja">
                <strong>Observaciones:</strong>
                <span id="observacion"></span>
            </div>

            <div class="mensaje-final mt-4 mt-md-5">
                <p>Su pedido ha sido recibido con éxito en Cafetería Feku.</p>
                <a href="/" class="btn-volver mt-3">Hacer otro pedido</a>
            </div>
        </div>

    </div>

    <script src="js/scriptt.js"></script>
</body>
</html>
